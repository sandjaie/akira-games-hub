<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fun with Words — Mockup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1c2a3a;
        --paper: #fff8ef;
        --sky: #7ec8e3;
        --sky-deep: #3a8fb7;
        --sun: #f0c43a;
        --coral: #e86f5c;
        --leaf: #5f9e6e;
        --lavender: #c9b6f2;
        --white: #fffdf8;
        --tap: 52px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        font-family: Nunito, system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse 120% 80% at 10% -10%, #bfe6f5 0%, transparent 55%),
          radial-gradient(ellipse 90% 70% at 100% 0%, #ffe9a8 0%, transparent 50%),
          linear-gradient(180deg, #eaf6fb 0%, var(--paper) 55%, #efe6d4 100%);
      }

      h1,
      h2 {
        font-family: Fredoka, Nunito, sans-serif;
        font-weight: 600;
        margin: 0;
      }

      .toolbar {
        display: flex;
        gap: 0.5rem;
        justify-content: center;
        flex-wrap: wrap;
        padding: 0.75rem 1rem;
        background: rgba(255, 253, 248, 0.85);
        border-bottom: 2px dashed rgba(28, 42, 58, 0.12);
        position: sticky;
        top: 0;
        z-index: 20;
      }

      .toolbar button,
      .card,
      .back,
      .ghost {
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        border: 3px solid transparent;
        border-radius: 999px;
        min-height: var(--tap);
        padding: 0.65rem 1.25rem;
      }

      .toolbar button {
        background: var(--sky-deep);
        color: white;
        box-shadow: 0 6px 16px rgba(28, 42, 58, 0.12);
      }

      .toolbar button[aria-pressed='true'] {
        background: var(--coral);
      }

      .screen {
        display: none;
        max-width: 720px;
        margin: 0 auto;
        padding: 1rem 1.25rem 2.5rem;
      }

      .screen.active {
        display: block;
      }

      .note {
        text-align: center;
        opacity: 0.7;
        font-size: 0.9rem;
        margin: 0.25rem 0 1rem;
      }

      /* Classic stacked rainbow arcs */
      .rainbow {
        --r-w: min(560px, 92vw);
        --r-h: 120px;
        position: relative;
        width: var(--r-w);
        height: var(--r-h);
        margin: 0 auto 0.75rem;
        filter: drop-shadow(0 8px 12px rgba(28, 42, 58, 0.1));
      }

      .rainbow.small {
        --r-w: min(280px, 70vw);
        --r-h: 72px;
        margin-bottom: 0.85rem;
      }

      .rainbow-arc {
        position: absolute;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        border-style: solid;
        border-bottom: none;
        border-color: transparent;
        border-top-left-radius: 50% 100%;
        border-top-right-radius: 50% 100%;
        box-sizing: border-box;
      }

      .rainbow-arc:nth-child(1) {
        width: 100%;
        height: 100%;
        border-width: calc(var(--r-h) * 0.14);
        border-top-color: #ff5a5a;
      }
      .rainbow-arc:nth-child(2) {
        width: 88%;
        height: 88%;
        border-width: calc(var(--r-h) * 0.14);
        border-top-color: #ff9f43;
      }
      .rainbow-arc:nth-child(3) {
        width: 76%;
        height: 76%;
        border-width: calc(var(--r-h) * 0.14);
        border-top-color: #ffd43b;
      }
      .rainbow-arc:nth-child(4) {
        width: 64%;
        height: 64%;
        border-width: calc(var(--r-h) * 0.14);
        border-top-color: #51cf66;
      }
      .rainbow-arc:nth-child(5) {
        width: 52%;
        height: 52%;
        border-width: calc(var(--r-h) * 0.14);
        border-top-color: #4dabf7;
      }
      .rainbow-arc:nth-child(6) {
        width: 40%;
        height: 40%;
        border-width: calc(var(--r-h) * 0.14);
        border-top-color: #845ef7;
      }

      .eyebrow {
        text-align: center;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-size: 0.8rem;
        color: var(--sky-deep);
        margin: 0;
      }

      .display {
        text-align: center;
        font-size: clamp(2rem, 6vw, 2.75rem);
        margin: 0.25rem 0 0.35rem;
      }

      .subtitle {
        text-align: center;
        margin: 0 0 1.25rem;
        font-weight: 700;
      }

      .cards {
        display: grid;
        gap: 1rem;
      }

      .card {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.75rem 1rem;
        align-items: center;
        text-align: left;
        border-radius: 24px;
        padding: 1rem 1.15rem;
        background: var(--white);
        box-shadow: 0 10px 24px rgba(28, 42, 58, 0.1);
        transition: transform 0.15s ease;
        width: 100%;
      }

      .card:hover:not(:disabled) {
        transform: translateY(-3px) scale(1.01);
      }

      .card:active:not(:disabled) {
        transform: scale(0.98);
      }

      .card:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        filter: grayscale(0.25);
      }

      .card .icon {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        font-size: 2rem;
      }

      .card h2 {
        font-size: 1.35rem;
      }

      .card p {
        margin: 0.15rem 0 0;
        font-weight: 700;
        opacity: 0.8;
      }

      .card.lab {
        border-color: #7ec8e3;
      }
      .card.lab .icon {
        background: #d8f1fb;
      }

      .card.words {
        border-color: #c9b6f2;
      }
      .card.words .icon {
        background: #efe7ff;
      }

      .card.soon {
        border-color: #c5cdd6;
      }
      .card.soon .icon {
        background: #eef1f4;
      }

      /* Level map */
      .levels {
        display: grid;
        gap: 0.75rem;
      }

      .level {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        background: var(--white);
        border-radius: 20px;
        padding: 0.9rem 1.1rem;
        border: 3px solid transparent;
        box-shadow: 0 8px 20px rgba(28, 42, 58, 0.08);
        font-weight: 800;
      }

      .level.open {
        border-color: #69db7c;
      }
      .level.locked {
        opacity: 0.55;
      }
      .level.done {
        border-color: var(--sun);
      }

      .badge {
        font-size: 1.25rem;
      }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 0.5rem;
      }

      .back,
      .ghost {
        background: white;
        color: var(--ink);
        border-color: rgba(28, 42, 58, 0.12);
      }

      /* Play screen */
      .play-stage {
        position: relative;
        min-height: 420px;
        background: linear-gradient(180deg, #dff3fb 0%, #fff8ef 55%, #ffe9c7 100%);
        border-radius: 28px;
        border: 4px solid white;
        box-shadow: 0 14px 32px rgba(28, 42, 58, 0.12);
        overflow: hidden;
        padding: 0.5rem 1rem 1.25rem;
      }

      .clouds {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 18% 28%, rgba(255, 255, 255, 0.85) 0 28px, transparent 29px),
          radial-gradient(circle at 24% 28%, rgba(255, 255, 255, 0.85) 0 36px, transparent 37px),
          radial-gradient(circle at 78% 22%, rgba(255, 255, 255, 0.8) 0 30px, transparent 31px),
          radial-gradient(circle at 84% 24%, rgba(255, 255, 255, 0.8) 0 40px, transparent 41px);
      }

      .drop-zone {
        position: relative;
        height: 220px;
        display: grid;
        place-items: center;
        margin-top: 0.25rem;
      }

      .falling-word {
        font-family: Fredoka, Nunito, sans-serif;
        font-size: clamp(2.6rem, 10vw, 4rem);
        font-weight: 700;
        letter-spacing: 0.12em;
        color: var(--ink);
        animation: fall-from-rainbow 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
        text-shadow: 0 4px 0 rgba(255, 255, 255, 0.7);
      }

      .falling-word .done {
        color: var(--leaf);
      }

      .falling-word .current {
        color: var(--sky-deep);
        border-bottom: 6px solid var(--sun);
        padding-bottom: 0.05em;
      }

      .falling-word .todo {
        color: rgba(28, 42, 58, 0.35);
      }

      .falling-word.shake {
        animation:
          fall-from-rainbow 0.9s cubic-bezier(0.22, 1, 0.36, 1) both,
          shake 0.35s ease;
      }

      @keyframes fall-from-rainbow {
        from {
          transform: translateY(-140px) scale(0.85);
          opacity: 0.15;
        }
        to {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-8px);
        }
        75% {
          transform: translateX(8px);
        }
      }

      .hint {
        text-align: center;
        font-weight: 800;
        margin: 0.5rem 0 1rem;
      }

      .keyboard-hint {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        justify-content: center;
        opacity: 0.75;
        font-size: 0.85rem;
        font-weight: 700;
      }

      .keycap {
        background: white;
        border: 2px solid rgba(28, 42, 58, 0.12);
        border-radius: 10px;
        padding: 0.35rem 0.55rem;
        min-width: 2rem;
        text-align: center;
      }

      .actions {
        display: flex;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 1rem;
        flex-wrap: wrap;
      }

      .actions .primary {
        background: var(--leaf);
        color: white;
        border: none;
        border-radius: 999px;
        font: inherit;
        font-weight: 800;
        min-height: var(--tap);
        padding: 0.65rem 1.35rem;
        cursor: pointer;
        box-shadow: 0 8px 18px rgba(28, 42, 58, 0.12);
      }
    </style>
  </head>
  <body>
    <div class="toolbar" role="tablist" aria-label="Mockup views">
      <button type="button" data-screen="hub" aria-pressed="true">1. Hub</button>
      <button type="button" data-screen="levels" aria-pressed="false">2. Word levels</button>
      <button type="button" data-screen="play" aria-pressed="false">3. Rainbow typing</button>
    </div>

    <section id="hub" class="screen active">
      <div class="rainbow small" aria-hidden="true">
        <span class="rainbow-arc"></span>
        <span class="rainbow-arc"></span>
        <span class="rainbow-arc"></span>
        <span class="rainbow-arc"></span>
        <span class="rainbow-arc"></span>
        <span class="rainbow-arc"></span>
      </div>
      <p class="eyebrow">Akira’s games</p>
      <h1 class="display">Welcome Akira!</h1>
      <p class="subtitle">Pick a game</p>
      <p class="note">Mockup only — cards are not wired to the real app yet.</p>
      <div class="cards">
        <button class="card lab" type="button">
          <span class="icon" aria-hidden="true">🖥️</span>
          <span>
            <h2>Parts of the computer</h2>
            <p>Find the parts!</p>
          </span>
        </button>
        <button class="card words" type="button" data-goto="levels">
          <span class="icon" aria-hidden="true">🌈</span>
          <span>
            <h2>Fun with Words</h2>
            <p>Type fun words!</p>
          </span>
        </button>
        <button class="card soon" type="button" disabled>
          <span class="icon" aria-hidden="true">✨</span>
          <span>
            <h2>Coming soon</h2>
            <p>More games later</p>
          </span>
        </button>
      </div>
    </section>

    <section id="levels" class="screen">
      <div class="rainbow" aria-hidden="true">
        <span class="rainbow-arc"></span>
        <span class="rainbow-arc"></span>
        <span class="rainbow-arc"></span>
        <span class="rainbow-arc"></span>
        <span class="rainbow-arc"></span>
        <span class="rainbow-arc"></span>
      </div>
      <div class="row">
        <button class="back" type="button" data-goto="hub">← Games</button>
        <p class="eyebrow" style="margin: 0">Fun with Words</p>
        <span style="width: 5.5rem"></span>
      </div>
      <h1 class="display">Pick a theme</h1>
      <p class="subtitle">Words fall from the rainbow!</p>
      <div class="levels">
        <div class="level done">
          <span>🐾 Animals</span>
          <span class="badge" title="Done">⭐</span>
        </div>
        <div class="level open">
          <span>🎨 Colors</span>
          <span class="badge">▶️</span>
        </div>
        <div class="level locked">
          <span>📚 School</span>
          <span class="badge">🔒</span>
        </div>
        <div class="level locked">
          <span>🏠 Home</span>
          <span class="badge">🔒</span>
        </div>
        <div class="level locked">
          <span>🎮 Play</span>
          <span class="badge">🔒</span>
        </div>
      </div>
      <div class="actions">
        <button class="primary" type="button" data-goto="play">Play Colors →</button>
      </div>
    </section>

    <section id="play" class="screen">
      <div class="row">
        <button class="back" type="button" data-goto="levels">← Themes</button>
        <p class="eyebrow" style="margin: 0">Colors</p>
        <button class="ghost" type="button" id="replay">Drop again</button>
      </div>
      <div class="play-stage">
        <div class="clouds" aria-hidden="true"></div>
        <div class="rainbow" aria-hidden="true">
          <span class="rainbow-arc"></span>
          <span class="rainbow-arc"></span>
          <span class="rainbow-arc"></span>
          <span class="rainbow-arc"></span>
          <span class="rainbow-arc"></span>
          <span class="rainbow-arc"></span>
        </div>
        <div class="drop-zone">
          <p class="falling-word" id="word" aria-live="polite">
            <span class="done">RE</span><span class="current">D</span><span class="todo"></span>
          </p>
        </div>
        <p class="hint">Type the word that fell from the rainbow</p>
        <div class="keyboard-hint" aria-hidden="true">
          <span class="keycap">R</span>
          <span class="keycap">E</span>
          <span class="keycap">D</span>
          <span class="keycap">⌫</span>
        </div>
      </div>
      <div class="actions">
        <button class="primary" type="button" id="next-word">Next word drops ✨</button>
      </div>
    </section>

    <script>
      const words = ['RED', 'BLUE', 'PINK', 'GOLD']
      let wordIndex = 0
      let typed = 2 // mock: already typed RE

      const screens = [...document.querySelectorAll('.screen')]
      const tabs = [...document.querySelectorAll('.toolbar button')]

      function show(id) {
        screens.forEach((s) => s.classList.toggle('active', s.id === id))
        tabs.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.screen === id)))
      }

      tabs.forEach((b) => b.addEventListener('click', () => show(b.dataset.screen)))
      document.querySelectorAll('[data-goto]').forEach((b) => {
        b.addEventListener('click', () => show(b.dataset.goto))
      })

      const wordEl = document.getElementById('word')

      function renderWord(animate) {
        const word = words[wordIndex]
        const done = word.slice(0, typed)
        const current = word[typed] ?? ''
        const todo = word.slice(typed + 1)
        wordEl.className = 'falling-word'
        wordEl.innerHTML =
          `<span class="done">${done}</span>` +
          (current ? `<span class="current">${current}</span>` : '') +
          (todo ? `<span class="todo">${todo}</span>` : '')
        if (animate) {
          // re-trigger CSS animation
          void wordEl.offsetWidth
          wordEl.classList.add('falling-word')
        }
      }

      function dropWord(next) {
        if (next) {
          wordIndex = (wordIndex + 1) % words.length
          typed = 0
        }
        wordEl.style.animation = 'none'
        void wordEl.offsetWidth
        wordEl.style.animation = ''
        renderWord(true)
      }

      document.getElementById('replay').addEventListener('click', () => dropWord(false))
      document.getElementById('next-word').addEventListener('click', () => dropWord(true))

      window.addEventListener('keydown', (e) => {
        if (!document.getElementById('play').classList.contains('active')) return
        const word = words[wordIndex]
        if (e.key === 'Backspace') {
          e.preventDefault()
          typed = Math.max(0, typed - 1)
          renderWord(false)
          return
        }
        if (e.key.length === 1 && /[a-z]/i.test(e.key)) {
          e.preventDefault()
          if (typed >= word.length) return
          if (e.key.toUpperCase() === word[typed]) {
            typed += 1
            renderWord(false)
          } else {
            wordEl.classList.remove('shake')
            void wordEl.offsetWidth
            wordEl.classList.add('shake')
          }
        }
      })

      renderWord(true)
    </script>
  </body>
</html>
